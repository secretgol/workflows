name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        run: xcodegen generate

      - name: CocoaPods bağımlılıklarını kur (MobileVLCKit)
        run: pod install

      - name: Derle (imzasız, cihaz için)
        run: |
          xcodebuild \
            -workspace StreamPlayer.xcworkspace \
            -scheme StreamPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: IPA paketle
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Uygulama: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr StreamPlayer-unsigned.ipa Payload
          rm -rf Payload
          ls -lh StreamPlayer-unsigned.ipa

      - name: IPA'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlayer-unsigned-ipa
          path: StreamPlayer-unsigned.ipa
          retention-days: 30
