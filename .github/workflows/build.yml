name: Build Windows, APK and IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate and configure Android project
        run: |
          flutter create --platforms=android --project-name open_iptv --org com.openiptv .
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          perms = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
          ]
          missing = "\n".join(x for x in perms if x.strip() not in txt)
          if missing:
              txt = txt.replace("<application", f"{missing}\n    <application", 1)
          if 'android:usesCleartextTraffic=' not in txt:
              txt = txt.replace("<application", '<application\n        android:usesCleartextTraffic="true"', 1)
          p.write_text(txt, encoding="utf-8")

          # Disable AGP lintVitalRelease crash (JavaDocParser NoSuchMethodError)
          for gname in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              gp = Path(gname)
              if gp.exists():
                  gt = gp.read_text(encoding="utf-8")
                  if "checkReleaseBuilds" not in gt and "android {" in gt:
                      gt = gt.replace(
                          "android {",
                          "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }",
                          1,
                      )
                      gp.write_text(gt, encoding="utf-8")
          PY
      - name: Install dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate and configure iOS project
        run: |
          flutter create --platforms=ios --project-name open_iptv --org com.openiptv .
          rm -rf test
          flutter pub get
          flutter build ios --config-only --no-codesign || true

          # Allow HTTP IPTV streams and local network playback
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Yerel ağdaki IPTV yayınlarına bağlanmak için gereklidir.'" ios/Runner/Info.plist

          # Enforce minimum iOS 13.0 for media_kit_libs_ios_video
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g" ios/Runner.xcodeproj/project.pbxproj

          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^#? ?platform :ios, .*/platform :ios, '13.0'/" ios/Podfile
            python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Podfile")
          txt = p.read_text(encoding="utf-8")
          patch = """    flutter_additional_ios_build_settings(target)
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
            end"""
          if "IPHONEOS_DEPLOYMENT_TARGET" not in txt and "flutter_additional_ios_build_settings(target)" in txt:
              txt = txt.replace("    flutter_additional_ios_build_settings(target)", patch, 1)
              p.write_text(txt, encoding="utf-8")
          PY
          fi
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf Payload open-iptv-unsigned.ipa
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r open-iptv-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-ipa
          path: open-iptv-unsigned.ipa

  windows:
    name: Windows (x64 ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate and configure Windows project
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name open_iptv --org com.openiptv .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          $mainCpp = "windows/runner/main.cpp"
          if (Test-Path $mainCpp) {
            $content = Get-Content $mainCpp -Raw
            $content = $content -replace 'L"open_iptv"', 'L"Open IPTV"'
            Set-Content $mainCpp $content -NoNewline
          }
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          if (Test-Path open-iptv-windows.zip) { Remove-Item open-iptv-windows.zip -Force }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "open-iptv-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-windows
          path: open-iptv-windows.zip
