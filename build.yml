name: Build APK and IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name open_iptv --org com.example .
          rm -rf test
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $f
          sed -i 's#^\(\s*\)<application#\1<application android:usesCleartextTraffic="true"#' $f
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate iOS project
        run: |
          flutter create --platforms=ios --project-name open_iptv --org com.example .
          rm -rf test
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist
          sed -i '' -E "s/^#? ?platform :ios, .*/platform :ios, '13.0'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g" ios/Runner.xcodeproj/project.pbxproj
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r open-iptv-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-ipa
          path: open-iptv-unsigned.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Windows project
        run: |
          flutter create --platforms=windows --project-name open_iptv --org com.example .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath open-iptv-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: open-iptv-windows
          path: open-iptv-windows.zip
