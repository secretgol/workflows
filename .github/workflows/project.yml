name: StreamPlayer

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StreamPlayer:
    type: application
    platform: iOS
    sources:
      - App
      - Theme
      - Models
      - Views
      - Assets.xcassets
      - path: Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.streamplayer
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# XcodeGen varsayılan olarak şema üretmez; CI'daki xcodebuild için paylaşılan şema şart.
schemes:
  StreamPlayer:
    build:
      targets:
        StreamPlayer: all
    run:
      config: Debug
    archive:
      config: Release
