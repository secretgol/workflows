name: iOS Nova IPTV - Build IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Check Xcode Version
      run: xcodebuild -version

    - name: Build iOS App (Ad Hoc - No Signing)
      run: |
        cd ios
        xcodebuild \
          -project NovaIPTV.xcodeproj \
          -scheme NovaIPTV \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          build

    - name: Create IPA from .app
      run: |
        cd ios/build/Build/Products/Release-iphoneos
        mkdir -p Payload
        cp -R NovaIPTV.app Payload/
        zip -r NovaIPTV.ipa Payload/
        echo "✅ IPA oluşturuldu!"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: NovaIPTV-iOS-IPA
        path: ios/build/Build/Products/Release-iphoneos/NovaIPTV.ipa
        retention-days: 30
